name: Google Cloud - staging server
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gcp-staging.yml'
      - 'infra/gcp/check-staging.py'
      - 'cloud-start*'
      - 'state-store*'
      - 'Dockerfile'
permissions:
  contents: read
concurrency:
  group: tcog-gcp-staging
  cancel-in-progress: false
jobs:
  staging:
    if: github.repository == 'og-netizen/asystent-tcog' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT: psychic-order-512811-k6
      GCP_REGION: europe-west3
      GCP_IMAGE: europe-west3-docker.pkg.dev/psychic-order-512811-k6/tcog/asystent
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Test operational behavior and real PostgreSQL engine
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
      - name: Authenticate without static keys
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: psychic-order-512811-k6
          workload_identity_provider: projects/411889473620/locations/global/workloadIdentityPools/tcog-github/providers/github
          service_account: tcog-github-deployer@psychic-order-512811-k6.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      - name: Refuse to overwrite an operational service
        shell: python
        run: |
          import json, subprocess
          args=['gcloud','run','services','list','--region=europe-west3','--project=psychic-order-512811-k6','--filter=metadata.name=tcog-staging','--format=json']
          services=json.loads(subprocess.check_output(args,text=True))
          for service in services:
              containers=service.get('spec',{}).get('template',{}).get('spec',{}).get('containers',[])
              mode=next((e.get('value') for c in containers for e in c.get('env',[]) if e.get('name')=='TCOG_SETUP_MODE'),None)
              if mode!='true':raise RuntimeError('Refusing to reset an operational service to setup mode')
      - name: Build and check container before publishing
        run: |
          docker build --pull --tag "$GCP_IMAGE:$GITHUB_SHA" .
          docker run --detach --name tcog-check --publish 127.0.0.1:18080:8080 --env TCOG_SETUP_MODE=true "$GCP_IMAGE:$GITHUB_SHA"
          trap 'docker rm --force tcog-check >/dev/null 2>&1 || true' EXIT
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent http://127.0.0.1:18080/health -o /tmp/tcog-health.json; then break; fi
            sleep 1
          done
          python3 -c 'import json; p=json.load(open("/tmp/tcog-health.json")); assert p["operational"] is False'
          gcloud auth configure-docker europe-west3-docker.pkg.dev --quiet
          docker push "$GCP_IMAGE:$GITHUB_SHA"
      - name: Deploy private staging in setup mode
        run: |
          gcloud run deploy tcog-staging --project="$GCP_PROJECT" --region="$GCP_REGION" --image="$GCP_IMAGE:$GITHUB_SHA" --service-account="tcog-runtime@$GCP_PROJECT.iam.gserviceaccount.com" --port=8080 --cpu=1 --memory=512Mi --min-instances=0 --max-instances=1 --concurrency=8 --timeout=60 --execution-environment=gen2 --set-env-vars=TCOG_SETUP_MODE=true --quiet
      - name: Read the exact service audience
        id: cloud_url
        shell: python
        run: |
          import os, subprocess
          url=subprocess.check_output(['gcloud','run','services','describe','tcog-staging','--project=psychic-order-512811-k6','--region=europe-west3','--format=value(status.url)'],text=True).strip()
          assert url.startswith('https://') and url.endswith('.run.app')
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('url='+url+'\n')
      - name: Generate an ID token through federation
        id: invoke_token
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: psychic-order-512811-k6
          workload_identity_provider: projects/411889473620/locations/global/workloadIdentityPools/tcog-github/providers/github
          service_account: tcog-github-deployer@psychic-order-512811-k6.iam.gserviceaccount.com
          token_format: id_token
          id_token_audience: ${{ steps.cloud_url.outputs.url }}
          id_token_include_email: true
          create_credentials_file: false
          export_environment_variables: false
      - name: Verify private access and disabled writes
        env:
          TCOG_ID_TOKEN: ${{ steps.invoke_token.outputs.id_token }}
        run: python3 infra/gcp/check-staging.py
