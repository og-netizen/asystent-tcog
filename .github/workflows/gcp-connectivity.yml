name: Google Cloud - connection check
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gcp-connectivity.yml'
      - 'infra/gcp/**'
permissions:
  contents: read
concurrency:
  group: tcog-gcp-connectivity
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'og-netizen/asystent-tcog' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Authenticate without a service account key
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: psychic-order-512811-k6
          workload_identity_provider: projects/411889473620/locations/global/workloadIdentityPools/tcog-github/providers/github
          service_account: tcog-github-deployer@psychic-order-512811-k6.iam.gserviceaccount.com
      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      - name: Verify identity and read migration resources
        run: bash infra/gcp/verify.sh
